[project]
name = "corecoder-mini"
version = "0.14.8rc1.post1"
requires-python = ">=3.10"
dependencies = ["openai>=2.8", "pydantic>=2", "jinja2>=3", "PyYAML>=6", "python-dotenv>=1", "rich>=13", "platformdirs==4.3.6", "psutil>=5", "litellm==1.82.6", "tenacity>=9"]

[tool.pytest.ini_options]
markers = ["docker: uses a real, already installed Docker image (no pulls)",
           "host_process: starts and terminates a real host process; requires process-control permissions"]

[tool.ruff]
exclude = ["vendor"]

[tool.ruff.lint.isort]
known-first-party = ["corecoder_mini", "scripts"]
